<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expert Fleet</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ---------- design tokens: full light palette, then dark twice ---------- */
:root{
  --bg:#F6F7F4; --bg2:#ECEFE9; --card:#FFFFFF; --line:#D9DED6; --line2:#C7CEC4;
  --ink:#1B2A2C; --ink2:#48595A; --ink3:#71827F; --acc:#0E6A70; --acc2:#0B565B;
  --accbg:#E3EFEE; --ok:#2E7D4F; --okbg:#E4F0E8; --warn:#96660F; --warnbg:#F5ECD9;
  --bad:#AD3E2C; --badbg:#F6E4E0; --run:#2A5F8F; --runbg:#E2EBF4;
  --code:#EFF2EC; --shadow:0 1px 2px rgba(27,42,44,.06),0 4px 14px rgba(27,42,44,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101A1C; --bg2:#0C1416; --card:#182527; --line:#27383A; --line2:#33474A;
  --ink:#D9E2E0; --ink2:#A3B3B1; --ink3:#748785; --acc:#5FB8BE; --acc2:#7CC8CD;
  --accbg:#1233359C; --ok:#5FB877; --okbg:#14301F99; --warn:#CFA054; --warnbg:#33270E99;
  --bad:#D97A66; --badbg:#3A1B1499; --run:#78AEDC; --runbg:#14283A99;
  --code:#131F21; --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --bg:#101A1C; --bg2:#0C1416; --card:#182527; --line:#27383A; --line2:#33474A;
  --ink:#D9E2E0; --ink2:#A3B3B1; --ink3:#748785; --acc:#5FB8BE; --acc2:#7CC8CD;
  --accbg:#1233359C; --ok:#5FB877; --okbg:#14301F99; --warn:#CFA054; --warnbg:#33270E99;
  --bad:#D97A66; --badbg:#3A1B1499; --run:#78AEDC; --runbg:#14283A99;
  --code:#131F21; --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.28);
}
*{box-sizing:border-box} html,body{height:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){
  .btn,.acard,.navbtn,.pill{transition:border-color .15s,background .15s,
    box-shadow .15s,transform .12s}
  .acard:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(1px)}
}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 "IBM Plex Sans",system-ui,"Segoe UI",Roboto,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
a{color:var(--acc2)}
/* ---------- shell: sidebar + main ---------- */
#app{display:flex;min-height:100%}
#side{width:216px;flex:0 0 216px;background:var(--bg2);border-right:1px solid var(--line);
  padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;
  height:100vh;overflow-y:auto}
#brand{font-weight:600;font-size:17px;letter-spacing:.01em;padding:4px 10px 12px;
  display:flex;align-items:center;gap:8px;font-family:"Newsreader",Georgia,serif}
#brand .dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;
  background:none;color:var(--ink2);padding:8px 10px;border-radius:8px;cursor:pointer;
  font:inherit;font-weight:500}
.navbtn:hover{background:var(--card);color:var(--ink)}
.navbtn.on{background:var(--accbg);color:var(--acc2);font-weight:600}
.navbtn .ic{width:18px;text-align:center;flex:0 0 18px}
.navbtn .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;
  font-size:10.5px;padding:1px 7px;font-weight:700}
#sideFoot{margin-top:auto;padding:10px;font-size:11px;color:var(--ink3)}
#main{flex:1;min-width:0;padding:20px clamp(14px,3vw,34px) 70px}
.pagehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 0 4px}
.pagehead h1{font-size:26px;margin:0;font-weight:600;
  font-family:"Newsreader",Georgia,serif;letter-spacing:.01em}
.pagehead h1.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:21px;
  font-weight:700}
.pagehead .sub{color:var(--ink3);font-size:13px}
.pagehead .spacer{flex:1}
/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.card>h3{margin:0;padding:11px 16px;font-size:13px;font-weight:650;color:var(--ink2);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card>h3 .spacer{flex:1}
.card .body{padding:13px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:0 14px}
.grid2>.card{margin:14px 0 0}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink);
  border-radius:8px;padding:7px 13px;font:inherit;font-weight:550;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc2)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.field,select.field,textarea.field{width:100%;background:var(--bg);color:var(--ink);
  border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font:inherit}
textarea.field{min-height:74px;resize:vertical}
label.lb{display:block;font-size:11.5px;font-weight:650;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.06em;margin:11px 0 4px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;
  font-weight:650;white-space:nowrap}
.pill.queued{background:var(--warnbg);color:var(--warn)}
.pill.running{background:var(--runbg);color:var(--run)}
.pill.done,.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.failed,.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.blocked{background:var(--badbg);color:var(--bad)}
.pill.dim{background:var(--bg2);color:var(--ink3)}
.pill.acc{background:var(--accbg);color:var(--acc2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink3);padding:7px 12px 7px 0;border-bottom:1px solid var(--line2)}
td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg2)}
.tablewrap{overflow-x:auto}
pre.out{background:var(--code);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px;font-size:12px;line-height:1.55;overflow:auto;max-height:420px;
  white-space:pre-wrap;word-break:break-word;margin:10px 0 4px;
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
.muted{color:var(--ink3)} .num{font-variant-numeric:tabular-nums}
.empty{padding:26px;text-align:center;color:var(--ink3)}
.kchip{display:inline-block;background:var(--bg2);border:1px solid var(--line);
  border-radius:7px;padding:6px 12px;margin:0 8px 8px 0;font-size:12.5px}
.kchip b{font-size:16px;margin-right:5px}
/* agent cards */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:13px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow);padding:13px 15px;cursor:pointer;position:relative}
.acard:hover{border-color:var(--acc)}
.acard h4{margin:0 0 2px;font-size:15px;display:flex;gap:8px;align-items:center;
  flex-wrap:wrap}
.acard .id{color:var(--ink3);font-size:12.5px;min-height:18px;margin-bottom:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:9.5px;font-weight:750;letter-spacing:.08em;padding:2px 7px;
  border-radius:4px}
.tag.trained{background:var(--accbg);color:var(--acc2)}
.tag.quick{background:var(--warnbg);color:var(--warn)}
.tag.retired{background:var(--bg2);color:var(--ink3)}
/* subtabs inside a workspace */
.subtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);
  margin:12px 0 2px}
.subtabs button{border:0;background:none;color:var(--ink3);font:inherit;font-weight:600;
  padding:8px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.subtabs button.on{color:var(--acc2);border-bottom-color:var(--acc)}
/* tree + viewer */
.mindwrap{display:grid;grid-template-columns:minmax(210px,300px) 1fr;gap:14px}
@media (max-width:760px){.mindwrap{grid-template-columns:1fr}}
#tree{max-height:520px;overflow:auto;font-size:12.5px;
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
#tree .t{cursor:pointer;padding:2px 6px;border-radius:5px;white-space:nowrap}
#tree .t:hover{background:var(--bg2)} #tree .t.on{background:var(--accbg);color:var(--acc2)}
#tree .d{color:var(--ink2);font-weight:700}
/* live pulse feed */
.feed{max-height:340px;overflow-y:auto}
.frow{display:flex;gap:10px;align-items:baseline;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.frow:last-child{border-bottom:0}
.fdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;align-self:center}
.fdot.ok{background:var(--ok)} .fdot.warn{background:var(--warn)}
.fdot.bad{background:var(--bad)} .fdot.info{background:var(--run)}
.frow .who{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--acc2);
  white-space:nowrap}
.frow .when{margin-left:auto;color:var(--ink3);font-size:11.5px;white-space:nowrap}
/* progress bars */
.bar{height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;
  min-width:64px;flex:1}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar.ok>i{background:var(--ok)}
.crs{padding:9px 0;border-bottom:1px solid var(--line)}
.crs:last-child{border-bottom:0}
/* dialog + toast */
#ovl{position:fixed;inset:0;background:rgba(10,18,19,.45);display:none;
  align-items:flex-start;justify-content:center;z-index:50;padding:6vh 14px}
#ovl.show{display:flex}
/* command palette: one place to ask for anything */
#cmdk{position:fixed;inset:0;background:rgba(10,18,19,.5);display:none;
  align-items:flex-start;justify-content:center;z-index:60;padding:10vh 14px}
#cmdk.show{display:flex}
#cmdbox{background:var(--card);border:1px solid var(--line2);border-radius:13px;
  box-shadow:var(--shadow);width:min(640px,100%);overflow:hidden}
#cmdq{border:0;border-bottom:1px solid var(--line);border-radius:0;
  font-size:15px;padding:14px 16px;width:100%}
#cmdq:focus{outline:none}
#cmdlist{max-height:52vh;overflow:auto}
.cmdrow{padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer;
  display:flex;flex-direction:column;gap:2px}
.cmdrow:last-child{border-bottom:0}
.cmdrow.on,.cmdrow:hover{background:var(--accbg)}
.cmdfoot{padding:9px 16px;border-top:1px solid var(--line);font-size:11.5px}
@media (max-width:860px){ #cmdk{padding:4vh 8px} #cmdlist{max-height:60vh} }
#dlg{background:var(--card);border:1px solid var(--line2);border-radius:13px;
  box-shadow:var(--shadow);width:min(660px,100%);max-height:86vh;overflow:auto}
#dlg h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
#dlg .db{padding:14px 18px}
#dlg .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;
  justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 17px;border-radius:9px;
  font-weight:600;display:none;z-index:60;max-width:88vw}
/* guide */
.step{display:flex;gap:13px;margin:15px 0}
.step .n{flex:0 0 27px;height:27px;border-radius:50%;background:var(--acc);color:#fff;
  font-weight:750;display:flex;align-items:center;justify-content:center;font-size:13px}
.step h4{margin:0 0 3px;font-size:14px}
.step p{margin:0;color:var(--ink2);font-size:13.5px}
.hero{background:linear-gradient(135deg,var(--accbg),transparent 65%);
  border:1px solid var(--line);border-radius:13px;padding:26px 24px;margin:16px 0}
.hero h2{margin:0 0 6px;font-size:24px;font-family:"Newsreader",Georgia,serif;
  font-weight:600}
/* teammate rail — the fleet as a roster of colleagues, always in view */
.wswrap{display:grid;grid-template-columns:1fr 210px;gap:16px;align-items:start}
/* a grid item defaults to min-width:auto, so it refuses to shrink below its
   widest child. On a phone that pushed a wide table past the viewport and
   the whole page scrolled sideways — the table's own .tablewrap could never
   help, because the COLUMN was the thing that would not narrow. */
.wswrap>*,.mindwrap>*{min-width:0}
#teammates{position:sticky;top:12px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);padding:8px}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);padding:4px 6px 8px}
.mate{display:flex;gap:8px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;padding:6px;cursor:pointer;color:inherit}
.mate:hover{background:var(--bg2)} .mate.on{background:var(--accbg)}
.mate .mn{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.mate .mn b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate .mn .muted{font-size:11px}
/* team runs read as threads */
.msg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.msg .from{font-size:12px;color:var(--acc2);font-family:"IBM Plex Mono",monospace}
.msg pre{white-space:pre-wrap;margin:6px 0 0;font-size:12.5px}
/* agent-authored cards (fixed catalogue, escaped text, never markup) */
.uicard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;
  background:var(--bg2)}
.uicard h4{margin:0 0 6px;font-size:13px}
.uicard table{width:100%;border-collapse:collapse;font-size:12.5px}
.uicard td,.uicard th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.uicard .del{color:var(--bad)} .uicard .ins{color:var(--ok)}
.uicard .mrow{display:flex;gap:16px;flex-wrap:wrap}
.uicard .mrow div{min-width:90px} .uicard .mrow b{font-size:18px;display:block}
/* responsive shell */
@media (max-width:860px){
  #app{flex-direction:column;padding-bottom:58px}
  /* the sidebar becomes a bottom bar: top:auto and height:auto are REQUIRED,
     or the desktop rule's top:0 + height:100vh stretches it over the page */
  #side{width:100%;position:fixed;top:auto;bottom:0;left:0;right:0;
    height:auto;max-height:66px;flex:0 0 auto;z-index:40;
    flex-direction:row;align-items:center;justify-content:space-around;
    overflow-x:auto;overflow-y:hidden;border-right:0;
    border-top:1px solid var(--line);border-bottom:0;padding:4px 6px;gap:2px;
    background:var(--card)}
  #brand{display:none} #sideFoot{display:none}
  .navbtn{width:auto;white-space:nowrap;padding:8px 10px;min-height:42px;
    flex-direction:column;gap:2px}
  .navbtn .lbl{font-size:10.5px}
  .wswrap{grid-template-columns:1fr}
  #teammates{position:static;order:-1;display:flex;gap:6px;overflow-x:auto;
    padding:6px}
  #teammates .rail-h{display:none}
  #railList{display:flex;gap:6px}
  .mate{width:auto;flex:0 0 auto}
  /* dialogs become bottom sheets: full width, thumb-reachable, never taller
     than the screen minus the nav bar */
  #ovl{padding:0;align-items:flex-end}
  #ovl #dlg{width:100%;max-width:100%;max-height:calc(92vh - 66px);
    border-radius:14px 14px 0 0;margin:0 0 66px}
  #dlg .df{position:sticky;bottom:0;background:var(--card)}
  .btn,.navbtn,.subtabs button{min-height:40px}
  .card{border-radius:12px} table{font-size:12px}
}
</style>
<script>
/* Theme, decided before first paint so there is no flash. The palette was
   DESIGNED light (warm paper, serif brand); dark is its twin for people
   who choose it. The OS preference used to decide silently — an owner who
   loved the light panel opened it on a dark-mode machine and thought the
   design was gone. Now: default LIGHT, remembered per browser, switched
   from the sidebar or the ⌘K palette. */
(function(){
  try{
    var t = localStorage.getItem("fleet_theme") || "light";
    if (t === "light" || t === "dark")
      document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
</head>
<body>
<div id="app">
  <nav id="side">
    <div id="brand"><span class="dot"></span><span class="t">Expert Fleet</span></div>
    <div id="navlist" style="display:contents"></div>
    <div id="sideFoot">
      <button class="btn sm ghost" id="themeBtn" onclick="toggleTheme()"
        style="margin-bottom:6px;width:100%" title="switch between the light
        and dark palette (remembered in this browser)">◐ theme</button>
      local panel · <span id="footRoot" class="mono"></span></div>
  </nav>
  <main id="main"><div class="empty">loading…</div></main>
</div>

<div id="ovl"><div id="dlg"><h3 id="dlgT"></h3><div class="db" id="dlgB"></div>
  <div class="df" id="dlgF"></div></div></div>

<div id="cmdk" onclick="if(event.target.id==='cmdk')closeCmd()">
  <div id="cmdbox">
    <input id="cmdq" class="in" autocomplete="off" spellcheck="false"
           placeholder="What do you want to do?  (type: create, task, backup, ready…)"
           oninput="renderCmd(this.value)">
    <div id="cmdlist"></div>
    <div class="cmdfoot muted">↑↓ to move · Enter to run · Esc to close ·
      every command shows the terminal equivalent</div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* =================================================================
   STATE + PLUMBING
================================================================= */
/* UI spec §2 — primary navigation follows JOBS, not architecture.
   §16 migration: Memory -> Resources + Proof, Models -> Admin, System ->
   Admin, Guide -> contextual help (no longer primary). Nothing was deleted:
   every previous view is still reachable, just filed where a user would
   look for it rather than where the code happens to live. */
const NAV = [
  ['home','Home'], ['work','Work'], ['agents','Agents'],
  ['resources','Resources'], ['proof','Proof'], ['admin','Admin'],
];
const NAV_PURPOSE = {
  home: "Start work and see what needs attention",
  work: "Everything being done",
  agents: "Create and manage intelligence",
  resources: "What agents know and can use",
  proof: "Evidence and quality",
  admin: "Infrastructure and policy",
};
const ICONS = {home:"🏠",work:"🎯",agents:"🤖",resources:"📚",
               proof:"✓",admin:"⚙",guide:"📖",memory:"🧠",models:"🔌",
               system:"🩺"};
const S = {view:"home", sel:null, sub:"ov", hist:false, sys:null, map:null,
           mindPath:null, timer:null, blockedN:0};

function token(){ return localStorage.getItem("fleet_token") || ""; }
async function api(url, opt){
  opt = opt || {};
  opt.headers = Object.assign({}, opt.headers);
  if (token()) opt.headers["Authorization"] = "Bearer " + token();
  if (opt.body && typeof opt.body === "object" && !(opt.body instanceof Blob)){
    opt.body = JSON.stringify(opt.body);
    opt.headers["Content-Type"] = "application/json";
  }
  try{
    const r = await fetch(url, opt);
    if (r.status === 401){
      const t = prompt("This panel is token-guarded. Paste the access token:");
      if (t){ localStorage.setItem("fleet_token", t.trim()); return api(url, opt); }
    }
    return await r.json();
  }catch(e){ return {error: String(e)}; }
}
function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function ago(iso){
  if(!iso) return "—";
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (isNaN(s)) return esc(iso);
  if (s<60) return Math.max(0,Math.round(s))+"s ago";
  if (s<3600) return Math.round(s/60)+"m ago";
  if (s<86400) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
function usd(x){ return "$"+(+x||0).toFixed(2).replace(/\.00$/,""); }
function currentTheme(){
  return document.documentElement.getAttribute("data-theme") || "light";
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem("fleet_theme", t); }catch(e){}
  const b=document.getElementById("themeBtn");
  if (b) b.textContent = t==="dark" ? "◑ theme: dark" : "◐ theme: light";
}
function toggleTheme(){ setTheme(currentTheme()==="dark" ? "light" : "dark"); }
document.addEventListener("DOMContentLoaded", ()=>setTheme(currentTheme()));
function toast(m){ const t=document.getElementById("toast");
  t.textContent=m; t.style.display="block";

async function runPreflight(){
  showDlg("Production preflight", `<p class="muted">auditing this installation…</p>`);
  const r = await api('/api/preflight', {method:"POST", body:{}});
  if (!r || r.error){ showDlg("Production preflight",
    `<div class="empty">${esc((r&&r.error)||"unavailable")}</div>`); return; }
  const rows = (r.findings||[]).map(f=>`
    <div style="margin:6px 0;padding:7px;border-left:3px solid ${
      f.level==="BLOCKER"?"var(--bad)":f.level==="RISK"?"var(--warn)":"var(--line)"}">
      <span class="pill ${f.level==="BLOCKER"?"bad":f.level==="RISK"?"warn":
        f.level==="OK"?"ok":""}">${esc(f.level)}</span>
      <span class="mono" style="font-size:12px">${esc(f.area)}</span>
      <div style="font-size:12.5px;margin-top:3px">${esc(f.what)}</div>
      ${f.fix?`<div class="mono muted" style="font-size:11.5px">→ ${esc(f.fix)}</div>`:""}
    </div>`).join("");
  showDlg("Production preflight", `
    <p><span class="pill ${r.verdict==="READY"?"ok":r.verdict==="NOT READY"?"bad":"warn"}">
      ${esc(r.verdict)}</span>
      <span class="muted">${r.counts.BLOCKER} blocker(s), ${r.counts.RISK} risk(s),
      ${r.counts.NOTE} note(s)</span></p>
    <p class="muted" style="font-size:12.5px">doctor says the software is healthy;
    this says whether it is fit to run your business unattended.</p>
    ${rows}
    <p class="mono muted" style="font-size:11.5px">python preflight.py</p>`);
}

function openCmd(){
  const el=document.getElementById("cmdk");
  el.classList.add("show");
  const i=document.getElementById("cmdq");
  i.value=""; renderCmd(""); i.focus();
}
function closeCmd(){ const e=document.getElementById("cmdk"); if(e) e.classList.remove("show"); }
function renderCmd(q){
  q=(q||"").toLowerCase().trim();
  const hits=COMMANDS.filter(c=>!q||(c[0]+" "+c[1]+" "+c[4]).toLowerCase().includes(q)).slice(0,12);
  const box=document.getElementById("cmdlist");
  box.innerHTML = hits.length ? hits.map((c,i)=>`
    <div class="cmdrow${i===0?" on":""}" data-run="${esc(c[2])}" onclick="runCmd(this)">
      <div><b>${esc(c[0])}</b> <span class="pill">${esc(c[1])}</span></div>
      ${c[3]?`<div class="mono muted" style="font-size:11.5px">${esc(c[3])}</div>`:""}
    </div>`).join("")
    : `<div class="empty">nothing matches — try "create", "task", "backup"</div>`;
}
function runCmd(el){
  const fn = el.getAttribute("data-run");
  closeCmd();
  try { (new Function(fn))(); } catch(e){ toast("could not run: "+e.message); }
}
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openCmd(); return; }
  const box=document.getElementById("cmdk");
  if(!box || !box.classList.contains("show")) return;
  const rows=[...document.querySelectorAll("#cmdlist .cmdrow")];
  const at=rows.findIndex(r=>r.classList.contains("on"));
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    if(!rows.length) return;
    const next=e.key==="ArrowDown"?Math.min(rows.length-1,at+1):Math.max(0,at-1);
    rows.forEach(r=>r.classList.remove("on")); rows[next].classList.add("on");
    rows[next].scrollIntoView({block:"nearest"});
  }
  if(e.key==="Enter" && rows[at<0?0:at]){ e.preventDefault(); runCmd(rows[at<0?0:at]); }
});
function typing(){
  const a=document.activeElement;
  return a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA") && a.value!=="";
}
function avatar(name, size){
  size = size||34;
  let x=0; for (const ch of String(name)) x = (x*31 + ch.codePointAt(0)) >>> 0;
  const h1=x%360, h2=(h1+40)%360;
  const initials = String(name).split(/[-_\s]+/).filter(Boolean)
    .slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" role="img"
    style="border-radius:10px;flex:0 0 ${size}px;vertical-align:middle">
    <defs><linearGradient id="g${x}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(${h1} 45% 38%)"/>
      <stop offset="1" stop-color="hsl(${h2} 50% 26%)"/></linearGradient></defs>
    <rect width="40" height="40" fill="url(#g${x})"/>
    <text x="20" y="26" text-anchor="middle" font-family="IBM Plex Sans,sans-serif"
      font-size="15" font-weight="700" fill="rgba(255,255,255,.92)">${initials}</text>
  </svg>`;
}
function hb(h, running){
  if (h && h.age_s != null){
    if (h.age_s < 90) return `<span class="pill ok" title="${esc(h.note||"")}">alive ${Math.round(h.age_s)}s</span>`;
    if (running) return `<span class="pill bad">stalled ${Math.round(h.age_s/60)}m</span>`;
    return `<span class="pill dim">off</span>`;
  }
  return running ? `<span class="pill queued">no pulse yet</span>`
                 : `<span class="pill dim">off</span>`;
}

/* DEEP LINKS — every view has a shareable URL. #work, #proof,
   #agent/<slug>, #agent/<slug>/goals, #agent/<slug>/goals/<goal-id> …
   The hash mirrors state one-way on navigation; on load (and back/forward)
   it is applied before the first render, so a pasted link opens exactly
   the screen the sender was looking at. */
function syncHash(){
  const h = S.sel
    ? "#agent/" + encodeURIComponent(S.sel) + "/" + (S.sub || "ov")
      + (S.sub === "goals" && S.goalSel ? "/" + encodeURIComponent(S.goalSel) : "")
    : "#" + (S.view || "home");
  if (location.hash !== h){
    try{ history.replaceState(null, "", h); }catch(e){}
  }
}
function applyHash(){
  const p = location.hash.replace(/^#/, "").split("/").filter(Boolean);
  if (!p.length) return;
  if (p[0] === "agent" && p[1]){
    S.view = "agents"; S.sel = decodeURIComponent(p[1]);
    S.sub = p[2] || "ov";
    S.goalSel = (S.sub === "goals" && p[3]) ? decodeURIComponent(p[3]) : null;
  } else if (/^[a-z]+$/.test(p[0])){
    S.view = p[0]; S.sel = null;
  }
}
window.addEventListener("hashchange", ()=>{ applyHash(); render(); });
function go(view){ S.view=view; S.sel=null; closeCmd(); render(); }

async function render(){
  renderNav();
  syncHash();
  const m = document.getElementById("main");
  if (S.sel){ await renderWorkspace(m); return; }
  if (S.view==="home")   await renderHome(m);
  if (S.view==="guide")  renderGuide(m);
  if (S.view==="agents") await renderAgents(m);
  if (S.view==="work")   await renderWork(m);
  if (S.view==="resources") await renderResources(m);
  if (S.view==="proof")  await renderProof(m);
  if (S.view==="admin")  await renderAdmin(m);
  /* still reachable by name from the palette and from Admin, per §16 */
  if (S.view==="memory") await renderMemory(m);
  if (S.view==="models") await renderModels(m);
  if (S.view==="system") await renderSystem(m);
  if (S.view==="guide")  renderGuide(m);
  if (S.view==="mission") await renderMission(m);
}
async function refreshSys(){
  const d = await api('/api/system');
  if (d && !d.error){ S.sys = d;

/* =================================================================
   ONBOARDING — UI spec §13, "first 10 minutes"

   Seven steps, in the spec's order. Two properties make this an onboarding
   rather than a slideshow:

     * every step reports whether it is ALREADY DONE, read from real state —
       so a person who created an agent by hand does not get told to create
       one, and a person who closes the panel resumes where they actually are;
     * step 7 ("only then expose advanced configuration") is not decoration.
       Until the earlier steps are done, the checklist is what Home leads
       with; afterwards it collapses to a single line.

   Dismissible and resumable: the dismissal is a local preference, and the
   PROGRESS is state, so dismissing hides the card without pretending the
   work was done.
================================================================= */
const ONBOARD = [

   why: "Everything else is shaped by this one answer.",
   act: "focus the command bar", run: "focusCmdBar()"},
  {id: "provider", title: "Connect one model, or run the local demo",
   why: "An agent with no model can still be built, but it cannot think.",

function onboardDone(){ return JSON.parse(localStorage.getItem("fleet_onboard")||"{}"); }
function onboardMark(id){
  const d = onboardDone(); d[id] = true;
  localStorage.setItem("fleet_onboard", JSON.stringify(d));
  render();
}
function onboardDismiss(){
  localStorage.setItem("fleet_onboard_hidden", "1"); render();
}
function onboardReopen(){
  localStorage.removeItem("fleet_onboard_hidden"); render();
}
/* Whether each step is done is READ FROM STATE wherever state can answer it.
   A checklist that only remembers what you clicked congratulates people for
   clicking, which is not the same as having a working fleet. */
function onboardProgress(sys){
  const marked = onboardDone();
  const experts = (sys && sys.experts) || [];
  const state = {
    goal:     !!marked.goal,
    provider: !!(sys && sys.ready) || !!marked.provider,
    path:     experts.length > 0,
    worker:   !!(S.workerCount > 0) || !!marked.worker,
    mission:  !!(S.missionCount > 0),
    proof:    !!marked.proof,
    advanced: !!marked.advanced,
  };
  return ONBOARD.map(s => ({...s, done: !!state[s.id]}));
}
function onboardHtml(sys){
  if (localStorage.getItem("fleet_onboard_hidden") === "1"){
    return `<div class="muted" style="font-size:12px;margin:4px 0">
      Setup checklist hidden —
      <a href="javascript:onboardReopen()">show it again</a></div>`;
  }
  const steps = onboardProgress(sys);
  const done = steps.filter(s=>s.done).length;
  if (done === steps.length){
    return `<div class="muted" style="font-size:12px;margin:4px 0">
      Setup complete — all ${steps.length} first steps done.
      <a href="javascript:onboardDismiss()">hide this</a></div>`;
  }
  return `
  <div class="card" style="border-color:var(--acc)">
    <h3>First 10 minutes — ${done} of ${steps.length} done
      <span class="spacer"></span>
      <button class="btn sm ghost" onclick="onboardDismiss()">hide</button></h3>
    <div class="body">
      <div class="bar" style="margin-bottom:8px"><i style="width:${
        Math.round(100*done/steps.length)}%"></i></div>
      ${steps.map((s,i)=>`
        <div class="step" style="opacity:${s.done?".55":"1"}">
          <div class="n">${s.done?"✓":i+1}</div>
          <div style="flex:1">
            <h4 style="margin:0">${esc(s.title)}</h4>
            <p class="muted" style="margin:2px 0;font-size:12.5px">${esc(s.why)}</p>
            ${s.done?"":`<div class="row" style="gap:6px">
              <button class="btn sm pri" onclick="${s.run}">${esc(s.act)}</button>
              <button class="btn sm ghost" onclick="onboardMark('${s.id}')">already did this</button>
            </div>`}
          </div>
        </div>`).join("")}
      <p class="muted" style="font-size:12px;margin-top:6px">Nothing here is
      required. Every step is also reachable from the navigation, and the
      checklist reads real state — creating an agent from the terminal ticks
      the box just as well as doing it here.</p>
    </div></div>`;
}

/* THE SYSTEMS MAP — the first thing a serious platform owes a visitor:
   what the systems ARE, how they differ, and what "done" means in each.
   One honest line per system; every row ends the same way — a mechanical
   check the worker cannot edit. */
function systemsMapHtml(open){
  const rows = [
    ["Task","one gated job for one role","a single deliverable you need now",
     "agent → Work → ＋ task","its done-check command exits 0"],
    ["Goal","pursued across cycles until frozen graders pass — machine path first (zero tokens), then plan → work → judge, and the judge is overruled if the graders disagree",
     "an outcome you can test mechanically","Work → New goal",
     "VERIFIED: every sealed acceptance test passes, run by the harness"],
    ["Mission","a standing objective with success criteria held on disk, served by many tasks/goals over weeks",
     "a responsibility, not a deliverable","Home bar → New mission",

/* ---- the universal agent: assess BEFORE starting ------------------------
   The layer that decides which of the platform's systems a goal needs. A goal
   handed straight to the pursuit loop assumes the expert already knows the
   subject and already owns the tools; when it does not, the run dies several
   milestones deep looking like a weak model, when the real answer was "it
   needed a PDF reader" or "it had never studied this".

   This is a READ. It routes and explains; it starts nothing and installs
   nothing, because a page that acts while you are still typing into it is not
   one anybody leaves open. */
async function checkReady(){
  const e = document.getElementById("cmdBar");
  const text = e ? e.value.trim() : "";
  if (!text){ toast("say what you want accomplished"); return; }
  const experts = ((S.sys||{}).experts)||[];
  if (!experts.length){ toast("create an expert first"); return; }
  const who = experts[0].name;
  const out = document.getElementById("readyOut");
  if (out) out.innerHTML = `<p class="muted" style="font-size:12.5px">assessing…</p>`;
  let r;
  try {
    r = await api(`/api/universal?expert=${encodeURIComponent(who)}`
                  + `&goal=${encodeURIComponent(text)}`);
  } catch(err){ if (out) out.innerHTML = `<p class="bad">${esc(String(err))}</p>`; return; }
  if (!out) return;
  if (r.error){ out.innerHTML = `<p class="bad">${esc(r.error)}</p>`; return; }
  const tone = r.verdict === "READY" ? "ok" : (r.needs_owner||[]).length ? "warn" : "muted";
  const rows = (r.blocking||[]).map(g => `
    <li><b>${esc(g.user_sees||g.dimension)}</b> — ${esc(g.what)}
        <br><span class="muted" style="font-size:12px">${esc(g.why)}</span>
        <br><span class="muted" style="font-size:12px">routes to: ${esc(g.routes_to)}</span></li>`).join("");
  const acts = (r.actions||[]).filter(a=>a.command).map(a => `
    <li>${esc(a.action)}: <code style="font-size:11.5px">${esc(a.command)}</code></li>`).join("");
  out.innerHTML = `
    <div class="card" style="margin-top:10px"><div class="body">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <b class="${tone}">${esc(r.verdict)}</b>
        <span class="muted" style="font-size:12px">${esc(who)}</span>
      </div>
      <p style="font-size:13px;margin:6px 0">${esc(r.why||"")}</p>
      ${rows ? `<ul style="font-size:13px;margin:6px 0 0;padding-left:18px">${rows}</ul>` : ""}
      ${acts ? `<p class="muted" style="font-size:12px;margin:10px 0 4px">To close these yourself:</p>
                <ul style="font-size:12px;margin:0;padding-left:18px">${acts}</ul>` : ""}
      <p class="muted" style="font-size:11.5px;margin:10px 0 0">Assessed from what
      is on disk now — capabilities probed, atoms counted, sources rated. READY
      means nothing known is missing; it never means this will succeed.</p>
    </div></div>`;
}

async function doMission(){

  if(!v("msObj")){ toast("give it an objective"); return; }
  if(!lines("msCrit").length){

  if(!v("msExp")){ toast("create an agent first"); return; }
  const r = await api('/api/missions', {method:"POST", body:{
    objective: v("msObj"), criteria: lines("msCrit"),
    constraints: lines("msCons"), non_goals: lines("msNo"),
    expert: v("msExp")}});

    closeDlg();
    toast(`mission started — ${r.criteria} criteria, contract ${r.fingerprint}`);

        ${next?`<div style="font-size:12px"><span class="pill ${

          ${esc(next.detail)}</div>`:""}

  const rc = document.getElementById("recentDone");
  if (!rc) return;
  rc.innerHTML = done.length ? done.slice(-6).reverse().map(x=>`
    <div class="frow" style="display:block;cursor:pointer"
         onclick="openMission('${esc(x.expert)}','${esc(x.id)}')">

    </div>`).join("")

function wizPick(i){
  W.lane = INTENT[i].lane;
  W.step = 0; W.data = {};
  /* Two lanes have their own well-made dialogs that ask for exactly the right
     things; sending a person through a six-step wizard to reach them would be
     ceremony, not clarity. §4's point is that nobody must know the taxonomy —
     not that every path must have six steps. */
  if (W.lane === "archetype"){ closeDlg(); dlgArchetype(); return; }
  if (W.lane === "team"){ closeDlg(); dlgLauncher(); return; }
  wizStep();
}
function wizSteps(){ return LANE_STEPS[W.lane] || LANE_STEPS.quick; }
function wizStep(){
  const steps = wizSteps();
  const key = steps[W.step];
  const n = W.step + 1, total = steps.length;
  const body = {
    job: wizJob, knowledge: wizKnowledge, access: wizAccess,
    quality: wizQuality, cost: wizCost, review: wizReview,
  }[key]();
  const back = W.step > 0 ? [["Back", "wizBack()", "ghost"]] : [["Cancel","closeDlg()","ghost"]];
  const next = key === "review"
      ? [["Create", "wizCreate()", "pri"]]
      : [["Next", "wizNext()", "pri"]];
  showDlg(`New specialist · step ${n} of ${total} — ${STEP_TITLE[key]}`, `
    <div class="bar" style="margin-bottom:10px"><i style="width:${
      Math.round(100*n/total)}%"></i></div>${body}`, back.concat(next));
}
function wizGrab(){
  const v = id => {const e=document.getElementById(id); return e?e.value.trim():"";};
  const on = id => {const e=document.getElementById(id); return !!(e&&e.checked);};
  const key = wizSteps()[W.step];
  if (key === "job"){
    W.data.name = v("wzName"); W.data.identity = v("wzId");
    W.data.examples = v("wzEx");
  } else if (key === "knowledge"){
    W.data.topic = v("wzTopic"); W.data.sources = v("wzSrc");
  } else if (key === "access"){
    W.data.kind = v("wzKind"); W.data.network = on("wzNet");
    W.data.computer = v("wzComp");
  } else if (key === "quality"){
    W.data.criteria = v("wzCrit"); W.data.done = v("wzDone");
    W.data.approve = on("wzAppr");
  } else if (key === "cost"){
    W.data.policy = v("wzPol"); W.data.budget = v("wzBudget");
  }
}
function wizNext(){
  wizGrab();
  if (wizSteps()[W.step] === "job" && !W.data.name){
    toast("give it a name"); return;
  }
  W.step = Math.min(W.step + 1, wizSteps().length - 1);
  wizStep();
}
function wizBack(){ wizGrab(); W.step = Math.max(0, W.step - 1); wizStep(); }

  const slug = r.created;

      expert: slug}});

/* UI spec §5 — tabs named for what the user is looking FOR.

   Knowledge / Skills / Performance / Advanced. Every old view is still

const SUBTABS = [["ov","Overview"],["board","Work"],["goals","Goals"],
                 ["teach","Knowledge"],["graph","Graph"],

  const sys = S.sys || await refreshSys();
  const row = ((sys&&sys.experts)||[]).find(e=>e.name===S.sel)||{};
  m.innerHTML = `
  <div class="pagehead">

      onclick="toggleRun('${esc(S.sel)}',${!!d.running})">${d.running?"⏸ stop loop":"▶ start loop"}</button>

/* TEAMMATE RAIL — the fleet is a roster of colleagues with ongoing roles,
   not a list of chats. Switching agent keeps you exactly where you were. */
function renderRail(){
  const el = document.getElementById("railList"); if (!el) return;
  const list = ((S.sys&&S.sys.experts)||[]);
  if (!list.length){ el.innerHTML = `<span class="muted">no teammates yet</span>`; return; }
  el.innerHTML = list.map(e=>{
    const alive = e.heartbeat && (Date.now()/1000 - (e.heartbeat.ts||0) < 90);
    const busy = (e.tasks&&e.tasks.running)||0, block=(e.tasks&&e.tasks.blocked)||0;
    return `<button class="mate ${e.name===S.sel?"on":""}" onclick="openAgent('${esc(e.name)}', S.sub)"
      title="${esc(e.identity||"")}">
      ${avatar(e.name, 26)}
      <span class="mn"><b>${esc(e.name)}</b>
        <span class="muted">${busy?busy+" working":(alive?"idle":"stopped")}</span></span>
      ${""}
      ${block?`<span class="pill bad">${block}</span>`:(e.approvals?`<span class="pill warn">${e.approvals}</span>`:"")}
    </button>`;
  }).join("");
}
async function renderIdentity(b, d){
  /* UI spec §5 — "Advanced: identity, prompts, roles, model wiring, raw
     files/traces". Wiring and the file tree already existed; what was missing
     was a way to REACH them that did not involve knowing an internal view
     name. Progressive disclosure (§14) means putting them behind one more
     click, not behind no click at all. */
  const adv = S.advTab || "identity";
  b.innerHTML = `
    <div class="subtabs">${[["identity","Identity & prompts"],

/* =================================================================
   FAILURE UX — UI spec §12

   The spec's table is a list of sentences the platform must be able to say
   instead of the ones it currently says:

     "Agent failed"       -> "Verifier rejected criterion 3: expected file X;
                             agent is retrying with a different plan."
     "Tool error"         -> name the tool, its failure rate, the last error,
                             and what the platform will do next.
     "Needs input"        -> the exact decision, the choices, the consequence
                             of each, and whether the default is safe.
     "Running" forever    -> current action, reason, elapsed, cost, next
                             checkpoint, and controls to stop it.
     raw trace as the UI  -> human-readable state first, trace under Advanced.

   `diagnose()` is where that translation lives, in ONE place, because the
   same task record is rendered on the board, in the dialog and on the home
   page — three copies of this reasoning would be three chances to disagree
   about what went wrong.
================================================================= */
function diagnose(t){
  const err = String(t.error || "");
  const sum = String(t.summary || "");
  const both = (err + "\n" + sum);
  const gate = t.done_check ? `\`${t.done_check}\`` : "the definition of done";

  /* WHO failed is the first question §12 asks, because the answer decides
     what the person should do. Ordered most specific first. */
  if (/done_check never passed/i.test(both)){
    const n = (both.match(/after (\d+) attempts?/i) || [])[1];
    return {
      who: "the verifier", severity: "bad",
      headline: `The check refused the work${n?` after ${n} attempt${n==="1"?"":"s"}`:""}`,
      detail: `${gate} did not pass, so the agent was not allowed to call this `
            + `done. That is the gate working: the alternative is accepting a `
            + `claim nobody checked.`,
      next: t.status === "failed"
          ? "Retries are exhausted. Look at what the check actually wants — "
          + "either the work is genuinely not finished, or the check is asking "
          + "for the wrong thing."
          : "The agent is retrying with what the check told it.",
      you: "Open the trace to see the last attempt, or edit the check if it is "
         + "asking for something the task was never meant to produce.",
    };
  }
  if (/^internal error|Traceback \(most recent/im.test(both)){
    const line = (both.match(/^([A-Za-z_.]*Error): (.+)$/m) || []);
    return {
      who: "the platform", severity: "bad",
      headline: "The platform itself failed, not the agent",
      detail: line[0] ? line[0].slice(0, 200)
                      : "an unexpected exception inside the loop",
      next: "This is filed as an infrastructure failure and will be retried; "
          + "if it recurs it appears under Performance -> keeps happening.",
      you: "Nothing the agent can do differently will fix this one.",
    };
  }
  if (/no key|api key|401|unauthor/i.test(both)){
    return {
      who: "the model provider", severity: "bad",
      headline: "The model provider refused the call",
      detail: "usually a missing or rejected API key",
      next: "The agent will fall back to another provider if one is configured.",
      you: "Add or fix the key under Admin -> Models & cost. Keys are never "
         + "shown back to you, only reported present or absent.",
    };
  }
  if (/rate.?limit|429|too many requests/i.test(both)){
    return {
      who: "the model provider", severity: "warn",
      headline: "Rate-limited by the provider",
      detail: "the provider asked us to slow down",
      next: "Backing off and retrying; a fallback provider is used if one is set.",
      you: "Nothing, unless this is constant — then raise the limit or add a "
         + "second provider.",
    };
  }
  if (/budget|daily cap|max_task_usd|spend/i.test(both)){
    return {
      who: "the budget breaker", severity: "warn",
      headline: "It stopped because it hit a spend limit",
      detail: "the ceiling is a breaker, not a warning — it stops rather than "
            + "quietly continuing",
      next: "Nothing further will run for this task until the limit changes.",
      you: "Raise the limit under Admin -> Models & cost if the work is worth it.",
    };
  }
  if (/timed out|timeout/i.test(both)){
    return {
      who: "the command it ran", severity: "warn",
      headline: "A command it ran never finished",
      detail: both.slice(0, 200),
      next: "The step is abandoned and retried; the sandbox is left clean.",
      you: "If this is a slow-but-correct command, raise its timeout.",
    };
  }
  if (t.status === "blocked"){
    return {
      who: "you", severity: "warn",
      headline: "It is waiting for a decision only you can make",
      detail: t.question || sum || "a question it cannot answer for itself",
      next: "Nothing happens until you answer — deliberately. This is the "
          + "class of problem that trying harder cannot solve.",
      you: "Answer it on the agent's Overview tab.",
    };
  }
  if (t.status === "running"){
    return {
      who: null, severity: "run",
      headline: "Working",
      detail: t.goal ? String(t.goal).slice(0, 160) : "",
      next: t.done_check ? `It may not call this done until ${gate} passes.`
                         : "No definition of done was set, so it will stop when "
                         + "it believes it is finished.",
      you: "Nothing — unless it has been longer than you expected, in which "
         + "case stop the loop from the agent's header.",
    };
  }
  if (t.status === "failed"){
    return {
      who: "the agent", severity: "bad",
      headline: "It could not complete the task",
      detail: err.slice(0, 220) || sum.slice(0, 220) || "no reason recorded",
      next: "Filed as a failure; a recurring one becomes a gotcha the whole "
          + "fleet reads before trying again.",
      you: "Read the goal — a task that cannot be finished is often one that "
         + "was never possible as written.",
    };
  }
  return null;
}
function diagnosisHtml(t){
  const d = diagnose(t);
  if (!d) return "";
  return `
    <div class="card" style="border-color:var(--${
      d.severity==="bad"?"bad":d.severity==="warn"?"warn":"line"})">
      <div class="body">
        <div class="row" style="align-items:baseline;gap:8px">
          <span class="pill ${d.severity==="run"?"running":d.severity}">${
            d.who ? esc(d.who)+" · " : ""}${esc(d.headline)}</span>
        </div>
        ${d.detail?`<div style="font-size:12.5px;margin-top:4px">${esc(d.detail)}</div>`:""}
        <div class="muted" style="font-size:12.5px;margin-top:4px">
          <b>What happens next:</b> ${esc(d.next)}</div>
        <div class="muted" style="font-size:12.5px">
          <b>What you can do:</b> ${esc(d.you)}</div>
      </div></div>`;
}

/* GENERATIVE UI, from a closed catalogue (A2UI's rule): the agent sends DATA
   and the panel draws it. Every string is escaped; no branch of this function
   can emit agent-authored markup, links or styles. */
function renderCard(c){
  if (!c || !c.type) return "";
  const title = c.title ? `<h4>${esc(c.title)}</h4>` : "";
  if (c.type==="table"){
    const cols=(c.columns||[]).map(x=>`<th>${esc(x)}</th>`).join("");
    const rows=(c.rows||[]).map(r=>`<tr>${(c.columns||[]).map((_,i)=>
      `<td>${esc((r||[])[i]==null?"":r[i])}</td>`).join("")}</tr>`).join("");
    return `<div class="uicard">${title}<div class="tablewrap"><table>
      <thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  if (c.type==="checklist"){
    return `<div class="uicard">${title}${(c.items||[]).map(i=>
      `<div style="font-size:12.5px">${i.done?"☑":"☐"} ${esc(i.text)}</div>`).join("")}</div>`;
  }
  if (c.type==="diff"){
    return `<div class="uicard">${title}
      ${c.path?`<div class="mono muted" style="font-size:12px">${esc(c.path)}</div>`:""}
      <pre class="out del">- ${esc(c.before||"")}</pre>
      <pre class="out ins">+ ${esc(c.after||"")}</pre></div>`;
  }
  if (c.type==="metric"){
    return `<div class="uicard">${title}<div class="mrow">${(c.metrics||[]).map(m=>
      `<div><b>${esc(m.value)}${esc(m.unit||"")}</b>
       <span class="muted" style="font-size:12px">${esc(m.label)}</span>
       ${m.delta?`<span class="pill ${String(m.delta).trim().startsWith("-")?"bad":"ok"}">${esc(m.delta)}</span>`:""}
      </div>`).join("")}</div></div>`;
  }
  return "";   /* unknown types are dropped, never rendered "as best we can" */
}
function ctxBar(used, budget){

  const col = pct>90 ? "var(--bad)" : pct>60 ? "var(--warn)" : "var(--acc)";
  return `<div style="background:var(--line);border-radius:3px;height:6px;width:120px;
    display:inline-block;vertical-align:middle"><div style="width:${pct}%;height:6px;
    background:${col};border-radius:3px"></div></div>`;
}

/* One file tree, two homes: the Skills tab and §5's Advanced -> Raw files.
   Two copies of this markup would drift the first time a class changed, and
   the second copy is exactly the one nobody would remember to fix. */
function fileTreeHtml(items, emptyMsg){
  const pad = p => "&nbsp;".repeat(2*(p.split("/").length-1));
  /* The API sends `d` for "is a directory"; this read `e.dir`, which is
     always undefined, so every folder was drawn as a clickable file and
     clicking one answered "approvals is a directory". Accept both spellings
     rather than only the one that happens to be current. */
  const isDir = e => e.d === true || e.dir === true;
  const size  = e => e.s ? ` <span class="muted" style="font-size:11px">${
    e.s < 1024 ? e.s + " B" : Math.round(e.s/1024) + " KB"}</span>` : "";
  return `<div id="tree">${items.length ? items.map(e => isDir(e)
    ? `<div class="t d" data-p="${esc(e.p)}">${pad(e.p)}▸ ${esc(e.p.split("/").pop())}/</div>`
    : `<div class="t" data-p="${esc(e.p)}" onclick="openFile('${esc(e.p)}')">${pad(e.p)}${esc(e.p.split("/").pop())}${size(e)}</div>`
  ).join("") : `<span class="muted">${esc(emptyMsg||"nothing here yet")}</span>`}</div>`;
}

async function setPolicy(name){
  const v = id => {const e=document.getElementById(id); return e?e.value.trim():"";};
  const body = {policy: name};
  if (name === "custom"){
    const bar = parseFloat(v("polBar"));
    if (isNaN(bar)){ toast("give the bar as a pass rate, e.g. 0.75"); return; }
    body.min_pass = bar; body.prefer = v("polPref");
  }
  const r = await api('/api/experts/'+S.sel+'/policy', {method:"POST", body});
  if (r && r.applied){
    toast(`${r.now.label||r.applied} — ${r.roles} role(s) updated`);
    loadPolicy();
  } else toast((r&&r.error)||"could not apply that policy");
}

   mission and its evidence. "Is this capability actually finished?" is about
   the platform and its proof level. Neither tab has a control that SETS a
   level, because a status somebody can click green is a status nobody can
   trust: the level is derived from evidence recorded against the current
   code, and it falls on its own when the code changes or the evidence ages.

  showDlg(`Proof · ${esc(name)}`, `

/* ---------- Metrics — manual §29 --------------------------------------
   The interesting half of this panel is the bottom: the metrics the platform
   cannot honestly compute, named with the reason. A dashboard where every
   tile has a number is one where you cannot tell measurement from decoration.
------------------------------------------------------------------ */
async function renderMetrics(b){
  const d = await api('/api/metrics');
  if (!d || d.error){ b.innerHTML = `<div class="empty">${
    esc((d&&d.error)||"unavailable")}</div>`; return; }
  const show = m => {
    /* the narrative row is checked FIRST: its value is null on purpose, and
       falling into the null branch would label a deliberate refusal to
       compute as missing data */
    if (m.unit === "narrative") return "—";
    if (m.value === null || m.value === undefined) return m.note ? "not yet" : "no data";
    if (typeof m.value === "boolean") return m.value ? "holds" : "does not hold";
    if (m.unit === "USD") return usd(m.value);
    if (m.unit === "count") return String(m.value);
    return Math.round(m.value * 1000) / 10 + "%";
  };
  b.innerHTML = `
    <p class="muted" style="max-width:80ch">${esc(d.caveat)}</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Metric</th><th>Now</th><th>Over</th><th>What it means</th></tr></thead>
      <tbody>${d.metrics.map(m=>`<tr>
        <td>${esc(m.metric)}</td>
        <td><span class="pill ${m.enough?"":"dim"}">${esc(show(m))}</span></td>
        <td class="muted mono" style="font-size:12px">${m.numerator}/${m.denominator}${
          m.enough?"":" <span class='pill dim'>too few</span>"}</td>
        <td style="font-size:12.5px">${esc(m.means||"")}
          ${m.note?`<div class="muted" style="font-size:12px">${esc(m.note)}</div>`:""}
          ${m.also?`<div class="muted" style="font-size:12px">${esc(m.also)}</div>`:""}
          ${(m.levers||[]).filter(l=>l.count).length?`<details><summary
            class="muted" style="cursor:pointer;font-size:12px">what the fleet
            actually did</summary>${m.levers.filter(l=>l.count).map(l=>`
            <div style="font-size:12px;padding:2px 0"><b>${l.count}</b> ${esc(l.lever)}
              <div class="muted">instead: ${esc(l.instead)}</div></div>`).join("")}
            </details>`:""}
          ${m.not_the_multiplier?`<div class="muted" style="font-size:12px;
            border-left:3px solid var(--warn);padding-left:7px;margin-top:4px">${
            esc(m.not_the_multiplier)}</div>`:""}
          <div class="muted" style="font-size:11.5px">from ${esc(m.source||"—")}</div></td>
      </tr>`).join("")}</tbody></table></div>
    <div class="card" style="border-color:var(--warn);margin-top:12px"><div class="body">
      <label class="lb">Not measured here, and why</label>
      ${d.not_measurable.map(r=>`<div style="font-size:12.5px;padding:3px 0">
        <b>${esc(r.metric)}</b>
        <div class="muted">${esc(r.why)}</div></div>`).join("")}
      <p class="muted" style="font-size:12px">Naming these is the point. A tile
      with a number in it looks like a measurement whether or not anything was
      measured, and the three above would be the easiest ones to fake.</p>
    </div></div>
    <p class="muted mono" style="font-size:12px;margin-top:8px">python metrics.py --json</p>`;
}

/* LIVE EVENTS (AG-UI style): the panel stops asking "anything new?" every six
   seconds and simply watches. Each line an agent writes arrives here as an
   event; the pulse grows in place. Polling stays as the fallback for browsers
   or proxies that will not keep a stream open. */
const EV_KINDS = ["task_start","tool_call","task_end","done_refused",
  "approval_required","prospective_fired","escalated","retry_queued",
  "premise_warning","model_routed","ui_card","health_ritual","stop_condition",
  "gotcha_filed","failure_recurred","skill_status","budget_exceeded"];
function connectEvents(){
  if (!window.EventSource || S.es) return;
  const t = token();
  let url = '/api/events'; if (t) url += '?token='+encodeURIComponent(t);
  let es;
  try { es = new EventSource(url); } catch(e){ return; }
  S.es = es;
  S.live = [];
  const push = (ev)=>{
    try { const row = JSON.parse(ev.data); S.live.unshift(row);
      S.live = S.live.slice(0,60); S.streamed = true; paintLive(row);
    } catch(e){}
  };
  EV_KINDS.forEach(k=>es.addEventListener(k, push));
  es.addEventListener("ready", ()=>{ S.streamOn = true; paintLive(null); });
  es.onerror = ()=>{ S.streamOn = false; try{es.close();}catch(e){} S.es=null;
    setTimeout(connectEvents, 5000); };
}
function feedRowHtml(r){
  return `<div class="frow"><span class="fdot ${esc(r.severity||"info")}"></span>
    <span class="who">${esc(r.expert||"")}</span>
    <span>${esc(r.text||"")}${r.detail&&r.detail.times?` (×${r.detail.times})`:""}</span>
    <span class="when">${ago(r.at)}</span></div>`;
}
function paintLive(row){
  const dot = document.getElementById("liveDot");
  if (dot){ dot.className = "pill " + (S.streamOn ? "ok" : "dim");
    dot.textContent = S.streamOn ? "live" : "polling"; }
  const el = document.getElementById("pulse");
  if (!el || !S.live.length) return;
  el.innerHTML = S.live.slice(0,40).map(feedRowHtml).join("");
  if (row && row.event==="approval_required" && S.view!=="home"){
    toast(row.expert + " needs your sign-off");
  }
}
(function boot(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("t")) { localStorage.setItem("fleet_token", h.get("t"));
    history.replaceState(null,"",location.pathname); }
  applyHash();               // a pasted deep link opens that exact screen
  render();
  connectEvents();
  S.timer = setInterval(()=>{
    if (document.hidden || typing()) return;
    if (document.getElementById("ovl").classList.contains("show")) return;
    // while the stream is open, Home and the Board repaint from events, so
    // the poll only refreshes the heavier views
    if (S.streamOn && !S.sel && (S.view==="home")) { refreshSys(); return; }
    render();
  }, 6000);
})();

    `<div class="empty">no graph yet — it grows from cited atoms as this agent
      studies. Teach it something (Knowledge tab → teach by link or files),
      and entities that recur across two or more atoms appear here.</div>`}
    <div id="kgSide" style="margin-top:8px"></div>
  </div></div>
  <div class="grid2">
  <div class="card"><h3>Load-bearing sources — concentration risk
    <span class="spacer"></span><span class="muted" style="font-weight:400;font-size:11.5px">
    one retraction here takes an area of knowledge with it</span></h3>
    <div class="body">${(d.load_bearing||[]).map(w=>`<div class="row" style="font-size:12.5px;padding:2px 0;gap:8px">
      <span class="pill ${w.tier<=1?'ok':(w.tier>=4?'bad':'dim')}">tier ${w.tier}</span>
      <span class="mono" style="word-break:break-all">${esc((w.source||"").slice(0,64))}</span>
      <span class="spacer"></span>
      <b>${w.atoms}</b><span class="muted">atoms · ${w.share}%</span></div>`).join("")
      ||`<div class="empty">nothing yet</div>`}</div></div>
  <div class="card"><h3>Weak claims — resting only on sources below the learn bar</h3>
    <div class="body">${(d.weak||[]).map(w=>`<div style="font-size:12.5px;padding:3px 0;border-left:3px solid var(--warn,#e0a63f);padding-left:8px;margin:3px 0">
      <b class="mono">${esc(w.id)}</b> ${esc((w.claim||"").slice(0,90))}
      <div class="muted" style="font-size:11px">tier ${w.tier} · ${esc((w.source||"").slice(0,70))}</div></div>`).join("")
      ||`<div class="empty">every claim rests on a source at or above the learn bar</div>`}</div></div>
  </div>`;
  if (ents.length) kgDraw(d);
}
function kgDraw(d){
  const cv = document.getElementById("kgCanvas"); if (!cv) return;
  const dpr = window.devicePixelRatio||1;
  const W = cv.clientWidth, H = 440;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const tierColor = {1:"#3fb96d",2:"#4f9cf0",3:"#e0a63f",4:"#e05a5a"};
  // cap for physics sanity: keep the most-evidenced entities
  const ents = Object.entries(d.entities||{})
    .sort((a,z)=>z[1].atoms.length-a[1].atoms.length).slice(0,140);
  const keep = new Set(ents.map(([k])=>k));
  const nodes = ents.map(([name,v],i)=>({
    name, n:v.atoms.length, tier:v.best_tier||4,
    x: W/2 + (W/3)*Math.cos(2*Math.PI*i/ents.length),
    y: H/2 + (H/3)*Math.sin(2*Math.PI*i/ents.length), vx:0, vy:0}));
  const idx = Object.fromEntries(nodes.map((n,i)=>[n.name,i]));
  const edges = (d.edges||[]).filter(([a,b])=>keep.has(a)&&keep.has(b))
    .map(([a,b,w])=>({a:idx[a], b:idx[b], w}));
  let dragging=null, hover=null, raf=null, ticks=0;
  function step(){
    ticks++;
    for (const e of edges){                       // springs
      const A=nodes[e.a], B=nodes[e.b];
      const dx=B.x-A.x, dy=B.y-A.y, dist=Math.hypot(dx,dy)||1;
      const want = 90 - Math.min(30, e.w*6);
      const f = (dist-want)*0.004*Math.min(3,e.w);
      A.vx+=f*dx/dist; A.vy+=f*dy/dist; B.vx-=f*dx/dist; B.vy-=f*dy/dist;
    }
    for (let i=0;i<nodes.length;i++){             // repulsion
      for (let j=i+1;j<nodes.length;j++){
        const A=nodes[i],B=nodes[j];
        const dx=B.x-A.x, dy=B.y-A.y; let d2=dx*dx+dy*dy;
        if (d2<1) d2=1; if (d2>36000) continue;
        const f=260/d2, dist=Math.sqrt(d2);
        A.vx-=f*dx/dist; A.vy-=f*dy/dist; B.vx+=f*dx/dist; B.vy+=f*dy/dist;
      }}
    for (const n of nodes){                       // integrate + walls
      if (n===dragging) continue;
      n.vx=(n.vx+ (W/2-n.x)*0.0004)*0.86; n.vy=(n.vy+(H/2-n.y)*0.0004)*0.86;
      n.x=Math.max(14,Math.min(W-14,n.x+n.vx));
      n.y=Math.max(14,Math.min(H-14,n.y+n.vy));
    }
    draw();
    if (ticks<600 && document.getElementById("kgCanvas")) raf=requestAnimationFrame(step);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth=1;
    for (const e of edges){
      const A=nodes[e.a],B=nodes[e.b];
      ctx.strokeStyle=`rgba(128,140,160,${Math.min(.55,.12+e.w*.1)})`;
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    }
    for (const n of nodes){
      const r = 4+Math.min(14,Math.sqrt(n.n)*2.4);
      ctx.beginPath(); ctx.arc(n.x,n.y,r,0,7);
      ctx.fillStyle=tierColor[n.tier]||tierColor[4];
      ctx.globalAlpha = n===hover?1:.82; ctx.fill(); ctx.globalAlpha=1;
      if (n.n>2 || n===hover){
        ctx.fillStyle="var(--ink)"; ctx.fillStyle="#c9d4e3";
        ctx.font="11px system-ui"; ctx.textAlign="center";
        ctx.fillText(n.name.length>18?n.name.slice(0,17)+"…":n.name, n.x, n.y-r-3);
      }}
  }
  const at=(ev)=>{const r=cv.getBoundingClientRect();
    return {x:(ev.clientX-r.left), y:(ev.clientY-r.top)};};
  const pick=(p)=>nodes.find(n=>Math.hypot(n.x-p.x,n.y-p.y) < 6+Math.sqrt(n.n)*2.4+4);
  cv.onmousedown=(ev)=>{ dragging=pick(at(ev)); if(dragging) cv.style.cursor="grabbing"; };
  cv.onmousemove=(ev)=>{ const p=at(ev);
    if (dragging){ dragging.x=p.x; dragging.y=p.y; ticks=Math.min(ticks,560); if(!raf||ticks>=600){ticks=0;step();} }
    else { const h=pick(p); if (h!==hover){ hover=h; draw(); } cv.style.cursor=h?"pointer":"grab"; } };
  cv.onmouseup=async (ev)=>{ const was=dragging; dragging=null; cv.style.cursor="grab";
    const p=at(ev); const n=!was||Math.hypot(was.x-p.x,was.y-p.y)<4 ? pick(p) : null;
    if (n) kgAbout(n.name); };
  step();
}
async function kgAbout(term){
  const el = document.getElementById("kgSide"); if (!el) return;
  el.innerHTML = `<span class="muted">reading atoms about ${esc(term)}…</span>`;
  const d = await api(`/api/knowledge?expert=${encodeURIComponent(S.sel)}&term=${encodeURIComponent(term)}`);
  const a = (d.about||{});
  el.innerHTML = `<div class="card"><h3 class="mono">${esc(term)}
    <span class="spacer"></span><span class="muted" style="font-weight:400;font-size:11.5px">
    ${(a.atoms||[]).length} atom(s) · every one carries its citation</span></h3>
  <div class="body">${(a.atoms||[]).map(x=>`
    <div style="border-left:3px solid var(--line);padding:3px 8px;margin:4px 0;font-size:12.5px">
      <b class="mono">${esc(x.id)}</b> ${esc(x.claim)}
      <div class="muted" style="font-size:11px">tier ${x.tier} · ${esc(x.course)} · ${esc((x.source||"").slice(0,90))}</div>
    </div>`).join("")||`<div class="empty">no atoms name it directly</div>`}
  </div></div>`;
}

/* =================================================================
   MASTERY — capability packs: sealed exams, honest scores, verdicts.
================================================================= */
async function renderMasteryPane(b){
  const d = await api(`/api/mastery?expert=${encodeURIComponent(S.sel)}`);
  if (d.error){ b.innerHTML=`<div class="empty">${esc(d.error)}</div>`; return; }
  const packs = d.packs||[];
  const fmt = s => (s==null?"—":Math.round(s*100)+"%");
  b.innerHTML = (packs.length?packs.map(p=>{
    const sc=p.scores||{}, v=p.verdict;
    const sealed = p.seal&&p.seal.ok;
    const lift = (sc.exam!=null&&sc.pretest!=null)?Math.round((sc.exam-sc.pretest)*100):null;
    return `<div class="card"><h3 class="mono">${esc(p.pack)}
      <span class="spacer"></span>
      ${sealed?`<span class="pill ok">SEALED</span>`
        : p.seal&&p.seal.tamper?`<span class="pill bad">TAMPER</span>`
        : (p.problems&&p.problems.length)?`<span class="pill warn">DRAFT — ${p.problems.length} TODO(s)</span>`
        :`<span class="pill dim">unfrozen</span>`}
      ${v?(v.mastered?`<span class="pill ok">MASTERED</span>`:`<span class="pill bad">NOT MASTERED</span>`):""}</h3>
    <div class="body">
      <div class="muted" style="font-size:12.5px">${esc(p.domain||"")} · author
        <b>${esc(p.author||"owner")}</b> — the author never sits this exam</div>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin:7px 0">
        ${(p.competencies||[]).map(c=>`<span class="kchip">${esc(c)}</span>`).join("")}</div>
      <div class="row" style="gap:16px;flex-wrap:wrap;font-size:13px">
        <span>pretest <b>${fmt(sc.pretest)}</b></span><span>→</span>
        <span>exam <b>${fmt(sc.exam)}</b></span>
        ${lift!=null?`<span class="pill ${lift>0?'ok':'dim'}">${lift>0?'+':''}${lift} lift</span>`:""}
        <span class="muted">·</span>
        <span>retention <b>${fmt(sc.retest)}</b></span>
        ${p.mastery_bar?`<span class="muted" style="font-size:11.5px">bars: practice ${Math.round((p.mastery_bar.practice_pass||0)*100)}% · transfer ${Math.round((p.mastery_bar.transfer_pass||0)*100)}%</span>`:""}</div>
      ${v?`<div class="muted" style="font-size:11.5px;margin-top:6px">${esc(v.ceiling||"")}</div>`:""}
      ${(p.problems&&p.problems.length)?`<details style="margin-top:6px"><summary class="muted" style="font-size:12px">what the draft still needs</summary>
        ${p.problems.slice(0,8).map(x=>`<div class="muted" style="font-size:11.5px">· ${esc(x)}</div>`).join("")}</details>`:""}
      <div class="muted mono" style="font-size:11px;margin-top:8px">python mastery.py run &lt;home&gt; ${esc(S.sel)} ${esc(p.pack)} --drive</div>
    </div></div>`;}).join("")
  : `<div class="card"><h3>Capability packs</h3><div class="body"><div class="empty">
      no packs in this fleet yet — draft one:
      <div class="mono" style="font-size:11.5px;margin-top:6px">python capability.py draft &lt;home&gt; my-domain --domain "what it is" --competency reading="study query"</div>
    </div></div></div>`);
}

/* =================================================================
   FRESHNESS — learned claims age; the panel shows the decay.
================================================================= */
async function loadFreshness(){
  const el = document.getElementById("freshBody"); if (!el) return;
  const d = await api(`/api/freshness?expert=${encodeURIComponent(S.sel)}`);
  if (d.error){ el.innerHTML = `<span class="muted">${esc(d.error)}</span>`; return; }
  const rows = [["retracted", d.retracted, "bad"],
                ["directive-shaped", d.suspect, "bad"],
                ["expired", d.expired, "warn"],
                ["superseded", d.superseded, "dim"]];
  const flagged = rows.reduce((n,[,l])=>n+(l||[]).length, 0);
  el.innerHTML = `
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <span class="kchip">${d.checked||0} atoms checked</span>
      <span class="kchip" style="color:var(--ok)">${d.fresh||0} fresh</span>
      ${flagged?`<span class="kchip" style="color:var(--warn)">${flagged} flagged</span>`
               :`<span class="kchip">nothing suspect</span>`}
      <span class="spacer"></span>
      <button class="btn sm ghost" onclick="dlgRetract()">record a retraction</button></div>
    ${rows.map(([label,list,tone])=>(list||[]).map(x=>`
      <div class="row" style="font-size:12.5px;padding:2px 0">
        <span class="pill ${tone}">${label}</span>
        <b class="mono">${esc(x.atom)}</b>
        <span class="muted">${esc(x.course)} · ${esc(x.why)}</span></div>`).join("")).join("")}
    <p class="muted" style="font-size:11.5px;margin-top:6px">Flags, never deletions: mark
    claims with [expires: date] or [supersedes: id] in notes; retractions match [src:]
    by substring. The atoms stay on disk — the owner decides what happens next.</p>`;
}
function dlgRetract(){
  showDlg("Record a retraction", `
    <label class="lb">Source ref (a DOI or URL substring, 8+ chars)</label>
    <input class="field" id="rtRef" placeholder="10.1234/withdrawn.2025.001">
    <label class="lb">Why</label>
    <input class="field" id="rtWhy" placeholder="publisher withdrew the study">
    <p class="muted" style="font-size:12px">Every atom whose [src:] contains this ref is
    flagged RETRACTED. The ledger is control-zoned — agents cannot retract the sources
    of claims they would rather not defend.</p>`,
    [["Cancel","closeDlg()","ghost"],["Retract","doRetract()","warn"]]);
}
async function doRetract(){
  const ref = document.getElementById("rtRef").value.trim();
  const why = document.getElementById("rtWhy").value.trim();
  const r = await api('/api/freshness/retract', {method:"POST",
    body:{expert:S.sel, ref, why}});
  closeDlg(); toast(r.error||"retraction recorded");
  loadFreshness();
}
</script>
