# ----------------------------------------------------------------- agent
[agent]
max_steps = 150                     # runaway-loop ceiling per task
command_timeout_seconds = 300       # hard timeout on run_command
model_timeout_seconds = 180
poll_interval_seconds = 10          # sleep when the queue is empty
context_token_threshold = 50000     # past this, oldest turns get compacted
context_keep_recent_messages = 10
max_malformed_tool_calls = 3
lock_stale_minutes = 30             # single-writer course lock staleness
# A task marked running is either being worked on now or was
# abandoned by a loop that died. Ownership is recorded on the task
# and a live owner is protected; this is only the backstop for when
# liveness cannot be checked (another host, or a recycled pid).
runner_lease_seconds = 900
reflect_after = ["practitioner"]    # roles that get a Reflector task on finish
daily_budget_usd = 10               # circuit breaker: pause when today's spend
                                    # hits this (0 disables). Provider spend
                                    # caps remain the outer wall.
max_output_tokens = 0               # cap per model response (0 = provider default)
retain_finished_tasks = 150         # finished tasks kept in the hot queue;
                                    # older ones move to logs/tasks-archive.jsonl
                                    # so a fleet running for months stays fast
max_task_usd = 2.0                  # hard per-run cost ceiling (0 disables) —
                                    # the third brake, beside max_steps and finish_task
max_done_rejects = 6                # refusals of finish_task before the task fails
escalate_after_errors = 3           # consecutive tool errors -> stronger model
exam_threshold = 90                 # minimum exam score for course completion
reexam_days = [7, 30, 90]           # spaced re-exams after completion (Part 8)
max_skills_loaded = 3               # skills/ playbooks auto-loaded per task

# --- keys the code reads that this file used to leave undeclared. An audit
# --- found ten of them; two decide containment, so an operator reading only
# --- settings.toml could not see what their fleet was actually doing.
auto_scan_inbox = true              # the idle tick scans inbox/ by itself
db_write = []                       # SQLite files (relative paths) a worker's
                                    # db_transaction may mutate and the
                                    # zero-model route may write. EMPTY grants
                                    # nothing: every db mutation refuses until
                                    # the owner names its file here.
git_write = []                      # git repositories (relative directories)
                                    # a worker's git_op may mutate and the
                                    # zero-model route may commit into. EMPTY
                                    # grants nothing, exactly like db_write.
http_write = []                     # endpoint NAMES (from the table below) a
                                    # worker's http_effect may write through
                                    # and the zero-model route may write
                                    # through. EMPTY grants nothing, exactly
                                    # like db_write; observation needs only
                                    # that the endpoint exists.
# The outward-facing world (docs/DESIGN-P8): a worker never names a host, it
# names one of these. Uncomment and edit to table an endpoint:
#
# [agent.http_endpoints.tickets]
# base = "https://api.example.com/v1"   # http(s), host only, no query/userinfo
# methods = ["GET", "POST", "PUT"]      # DELETE absent = refused
# auth_env = "TICKETS_TOKEN"            # the NAME of the variable holding the
#                                       # bearer (agent.env or the environment);
#                                       # unset = the endpoint refuses, it never
#                                       # calls anonymously
# max_bytes = 1048576                   # response cap
inbox_settle_seconds = 10           # ignore files still being copied in
max_task_retries = 3                # retries of a failed task before it rests
candidates_max = 5                  # test-time compute: attempts to score
candidates_on_gate_failure = true   # escalate n on a refused finish_task
design_gate = true                  # interface deliverables must pass designcheck

# --- ADAPTIVE TEST-TIME COMPUTE (candidates.py). After every refused
# --- finish_task the loop asks whether another attempt is worth its cost.
# --- These are the terms of that arithmetic, and an operator who cannot see
# --- them cannot see why their fleet stopped trying.
candidate_recovery_prior = 0.2      # P(another sample fixes it) before evidence
candidate_min_observations = 5      # development rows needed to replace the prior
candidate_model_cost_usd = 0.01     # assumed cost of one more attempt
candidate_verifier_cost_usd = 0.001 # assumed cost of scoring it
candidate_latency_cost_usd = 0.0    # priced waiting, if you price waiting
candidate_budget_usd = 1.0          # ceiling when the task declares none
candidate_task_value_usd = 1.0      # what a verified success is worth here
# Sampling stops when expected benefit <= cost, or at max_done_rejects.

# --- GLOBAL CONTEXT BUDGET (context.py). The absolute ceiling on a compiled
# --- window: the model's context limit, minus what the answer needs, minus
# --- the tool schemas, minus a safety margin. Exceeding it REFUSES rather
# --- than silently truncating, so these numbers decide what the model can be
# --- shown at all. Commented: each already has the code default written here,
# --- and a per-model limit is better read from the provider block.
# context_limit = 131072            # fallback when the provider declares none
# context_completion_reserve = 4096 # tokens kept free for the reply
# context_tool_schema_budget = 2048 # measured from the real tool JSON when it can be
# context_safety_margin = 1024      # the "this is a byte upper bound" allowance
# [agent.context_budget]            # per-source ceilings; omitted = the shipped
#   memory_files = 12000            # defaults in context.DEFAULT_BUDGETS
#   skills = 3000

# --- SOURCE AUTHORITY (sources.py)
# learn_min_tier = 3                # lowest source tier a course may learn from
# source_tier = {}                  # owner overrides, by exact hostname

# --- MEMORY ROUTING (memrouter.py)
# [agent.memory_router]             # per-role overrides of which memory KINDS
#   student = []                    # load; the student's closed-book rule is
                                    # code, not config, and cannot be widened here

# --- SECOND DISCOVERY LANE (discovery_web.py). Off unless an owner turns it
# --- on AND supplies a credential-free endpoint; every result still passes
# --- source classification, freshness and fencing.
# [agent.discovery.general_web]
#   enabled = false
#   endpoint = "https://searx.example/search"
#   max_age_days = 365

# --- COST OF TRANSCRIPTION (ingest.py)
# whisper_per_hour_usd = 0.0        # priced into the spend ledger when set

# --- HARNESS
# command_policy = "..."            # owner-supplied extra policy patterns,
                                    # ADDED to the built-in REVIEW list

# --- PARALLELISM (scheduler.py)
# max_parallelism = 1               # ceiling the scheduler may propose; the
                                    # swarm only ever parallelises DECLARED
                                    # independent work regardless

# --- LAYERED VERIFICATION (verification.py). Commented, because writing it
# --- would CHANGE behaviour rather than describe it: the code default is
# --- false, and setting it true declares every task high-value, so every
# --- judged task then demands a judge from a different model family.
# verification_require_distinct_family = false

# --- EXECUTION (sandbox.py). Commented for the same reason, and this one
# --- matters more: the default is "workspace", under which the hosted
# --- backends (e2b/daytona) REFUSE to run, because no authorized way to send
# --- a workspace out and bring artifacts back exists yet. Writing
# --- "stateless" is you asserting the work needs no files back — it lifts a
# --- fail-closed control, so it must be a deliberate sentence, never a
# --- default someone inherited from a settings template.
# sandbox_workload = "workspace"

# WHERE model-written commands run, and WHAT they can see. Both the tool path
# (run_command) and the verification path (done_check / spec CHECK: lines) go
# through these — the gate used to bypass them and see the full environment.
sandbox = "docker"                  # mandatory containment by default
allow_unsafe_host = false            # developer-only; host has NO authority isolation
                                    # An unavailable backend FAILS CLOSED: it
                                    # refuses rather than falling back to host.
sandbox_network = false             # acquisition grants egress only to its arena
# sandbox_image = "python:3.12-slim"  # image for the docker backend
command_env_allow = []              # env vars a command MAY see. Everything
                                    # credential-shaped is withheld by default;
                                    # name one here only when a tool needs it.

# Layered verification for open-ended work (verification.py). Empty = L0
# mechanical gates only, which stay supreme either way: a configured judge
# can confirm or annotate, never overturn a failing mechanical check.
# verification_layers = [
#   {level = 1, kind = "specialist", role = "examiner"},
#   {level = 4, kind = "frontier", role = "examiner", model = "strong"},
# ]

# Hybrid memory retrieval's OPTIONAL local embedding model (retrieval.py).
# Absent = lexical + metadata + freshness only, honestly labeled as such.
# [agent.memory_retrieval]
# local_model_path = "/models/all-MiniLM-L6-v2"   # local dir, never fetched

# The cognitive scheduler (scheduler.py). `enabled` hands it routing
# authority — leave that false until its outcome ledger has earned trust.
# `shadow` (default true) makes it DECIDE-AND-LOG on every routed task
# without routing anything: decisions land in logs/scheduler-decisions.jsonl,
# the loop files each task's real outcome against them, and the evidence for
# (or against) enabling it accrues at zero risk.
[agent.scheduler]
enabled = false
shadow = true
# The utility terms it maximises: P(verified success) x value, minus model,
# tool, verifier, latency and risk cost. Declared here so the arithmetic is
# inspectable rather than buried.
task_value_usd = 1.0                # what one verified success is worth
budget_usd = 1.0                    # ceiling when the task declares none
min_observations = 5                # similar verified rows before it trusts a rate
latency_usd_per_second = 0.0        # priced waiting, if you price waiting
risk_cost_usd = 0.0                 # priced failure, beyond its retry cost
fallback_cost_usd = 0.01            # assumed cost of the role's configured pair
# strategies = []                   # owner-declared executable strategies;
                                    # a task payload can never introduce one

# Module ablation, for experiments only. Named modules are switched OFF so a
# delta can be attributed to them. Never a production setting.
# [evaluation]
# disabled_modules = ["memory", "skills", "runbooks", "candidates", "routing",
#                     "confidence", "repair", "research_brief", "swarm",
#                     "verification_tiers", "procedures"]
# single_provider_attempt = false   # raw arm: no failover, one provider

# Pipeline chaining: when the left role finishes a task, queue the right role
# on the same course. Gaps feedback (the mandated edge) is automatic anyway.
[agent.chain]
ripper = "watcher"
student = "examiner"                # a sat exam is always graded
# watcher = "practitioner"          # enable to auto-execute after each study pass
# practitioner = "examiner"         # enable to auto-grade after each execution

# ------------------------------------------------------------- providers
# Any OpenAI-compatible endpoint works. Keys come from the environment
# (api_key_env) or a file readable only by the agent user (api_key_file) —
# never from this repo. Set spend caps on every key BEFORE first use.

[providers.deepseek]
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
# api_key_file = "/home/agent/.keys/deepseek"
input_per_mtok = 0.27               # USD per 1M input tokens (for cost logging)
output_per_mtok = 1.10

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
input_per_mtok = 0.59
output_per_mtok = 0.79

[providers.nvidia]
# NVIDIA Build: 100+ hosted models — including frontier-class open weights
# (DeepSeek V4 Pro, Kimi K2.5, GLM-5.1, Qwen 3.5, Llama 4, Nemotron) — with
# a FREE Developer Program key from build.nvidia.com (nvapi-…, no card).
# Verified 2026-08: 1,000 free credits at signup (≈1 credit/request; up to
# 5,000 on request via their forum), ~40 req/min raisable to 200. Free but
# BOUNDED — ideal as a frontier-quality escalation/judge rail beside the
# dirt-cheap lane, not as the only rail for a busy 24/7 fleet.
# OpenAI-compatible, so it drops straight into any role:
#   [roles.watcher]  provider = "nvidia"  model = "deepseek-ai/deepseek-v4"
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"

[providers.huggingface]
# Hugging Face Inference Providers router: one HF token reaches Groq,
# Together, Fireworks, Cerebras and more, with free monthly credits.
# Browse ids at huggingface.co/models?inference_provider=all
base_url = "https://router.huggingface.co/v1"
api_key_env = "HF_TOKEN"

# ---------------------------------------------------------------------------
# EVERY PROVIDER BELOW WAS VERIFIED AGAINST ITS OWN DOCUMENTATION, not from
# memory: the base_url, whether the endpoint is OpenAI-compatible, whether it
# supports native tool calling, and what the free tier ACTUALLY is. A wrong
# base_url does not fail loudly — it produces an opaque 404 months later — so
# each is cited to the page it came from.
#
# The honest summary of "free": only ONE of these has a standing free
# allowance that needs no card and never expires. The rest are trials,
# one-off credits, or require a payment method on file. That distinction is
# written on each block rather than smoothed over.
#
# To activate any of them: uncomment the block, put its key in agent.env, and
# point a role at it. `python doctor.py` then reports it ready.
# ---------------------------------------------------------------------------

# Cerebras — very fast inference. Verified: inference-docs.cerebras.ai/resources/openai
# FREE TIER: none that is permanent. $5 in credits only after adding a
# verified payment method, expiring after 30 days, and rate-limited to about
# 5 requests/minute — roughly one request every 12 seconds, which is tight
# for an agent loop that takes several steps per task.
# GOTCHA, documented: gpt-oss-120b REJECTS a request carrying both `tools`
# and `response_format`. This platform sends tools, so do not also set a
# response format for this provider.
# [providers.cerebras]
# base_url = "https://api.cerebras.ai/v1"
# api_key_env = "CEREBRAS_API_KEY"
# model: "gpt-oss-120b"

# Fireworks. Verified: docs.fireworks.ai/tools-sdks/openai-compatibility
# NOTE THE PATH — it is /inference/v1, not the usual /v1. Dropping the
# "/inference" segment is the single most likely cause of a 404 here.
# FREE TIER: $1 of one-off credits; an account with no payment method is
# capped at 10 requests/minute.
# Model ids look like "accounts/fireworks/models/<name>" and serverless
# availability rotates — check the model page still says "Serverless:
# Supported" before relying on one.
# [providers.fireworks]
# base_url = "https://api.fireworks.ai/inference/v1"
# api_key_env = "FIREWORKS_API_KEY"
# model: "accounts/fireworks/models/kimi-k3"

# Mistral. Verified: docs.mistral.ai/resources/migration-guides
# FREE TIER: the "Free" plan includes $10/month of API credits under fair use.
# [providers.mistral]
# base_url = "https://api.mistral.ai/v1"
# api_key_env = "MISTRAL_API_KEY"
# model: "mistral-large-2512"

# Together AI. Verified: docs.together.ai/docs/openai-api-compatibility
# FREE TIER: none documented. Their docs describe no signup credits; the only
# free thing confirmed is a single free-priced serverless model. The pricing
# page says "start for free" without saying what that means, and a marketing
# page is not documentation.
# [providers.together]
# base_url = "https://api.together.ai/v1"
# api_key_env = "TOGETHER_API_KEY"
# model: "MiniMaxAI/MiniMax-M3"

# OpenAI. Verified: developers.openai.com/api/reference
# FREE TIER: none unconditional. Some organisations are offered complimentary
# daily tokens IN EXCHANGE FOR sharing prompts and completions for training,
# and a positive balance is still required. Read that trade before taking it:
# this platform's whole point is that your expert's memory is your asset.
# [providers.openai]
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# model: "gpt-5.6-sol"

# Cloudflare Workers AI. Serverless inference on Cloudflare's own network,
# with an OpenAI-compatible /v1/chat/completions endpoint — so it is an
# ordinary provider here, not an integration. There is a standing free
# allocation of 10,000 Neurons/day.
#
# PICK A MODEL THAT SUPPORTS FUNCTION CALLING. This is not a preference.
# Every step this agent takes is a native tool call, so a model without
# function calling cannot drive the loop at all — it will emit prose where a
# tool call belongs and the step is rejected. (There is a fallback:
# native_tools = false switches to the grounding header's inline-JSON format.
# It works, it is measurably less reliable, and it is not the default for a
# reason.) Cloudflare tags this capability per model; verified 2026-08-25
# against developers.cloudflare.com/workers-ai/models?capabilities=Function+calling
#
# Free steps/day on this platform's own MEASURED 1083-token window
# (test_endurance, median of 42 windows) with a 500-token reply, and the cost
# once the free allocation is spent, at $0.011/1000 Neurons:
#
#   @cf/qwen/qwen3-30b-a3b-fp8                 20.2 N/step   493/day   $0.22/1k
#   @cf/openai/gpt-oss-20b                     33.3 N/step   300/day   $0.37/1k
#   @cf/openai/gpt-oss-120b                    68.5 N/step   145/day   $0.75/1k
#   @cf/meta/llama-3.3-70b-instruct-fp8-fast  131.3 N/step    76/day   $1.44/1k
#
# qwen3-30b-a3b-fp8 is the default recommendation: it is the cheapest model
# on the list that can call tools, by 1.6x, and it carries a 32k context.
# See CLOUDFLARE.md for the arithmetic and the sensitivity to reply length.
#
# ACCOUNT_ID is not a secret and goes in the URL; the token is a secret and
# goes in agent.env as CLOUDFLARE_API_TOKEN. Create it at
# dash.cloudflare.com -> AI -> Workers AI -> "Use REST API", which mints a
# token scoped to Workers AI alone rather than to the whole account.
# [providers.cloudflare]
# base_url = "https://api.cloudflare.com/client/v4/accounts/ACCOUNT_ID/ai/v1"
# api_key_env = "CLOUDFLARE_API_TOKEN"
# input_per_mtok = 0.051           # qwen3-30b-a3b-fp8, so the budget breaker
# output_per_mtok = 0.335          # measures real spend rather than guessing
# model = "@cf/qwen/qwen3-30b-a3b-fp8"

# The same call routed through AI Gateway instead — identical contract, plus
# caching, rate limiting, retries, per-request cost analytics and a log of
# every prompt. One URL change, no code change.
# [providers.cloudflare_gateway]
# base_url = "https://gateway.ai.cloudflare.com/v1/ACCOUNT_ID/GATEWAY/workers-ai/v1"
# api_key_env = "CLOUDFLARE_API_TOKEN"

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# CEILING prices for the budget breaker, deliberately set ABOVE the value
# lane's real rates (OpenRouter prices vary per model id). The breaker
# must be able to fire: overestimating spend trips it early — annoying
# but safe; a provider with no price records $0 and the breaker never
# fires — cheap-looking and unprotected. Using :free ids? Real spend is
# $0 and this ceiling merely counts tokens against your daily cap;
# tighten per-model if the estimate bothers you.
input_per_mtok = 1.50
output_per_mtok = 4.00
# native_tools = false             # set for models without function calling;
                                   # the agent then uses the grounding header's
                                   # inline-JSON tool format automatically
# [providers.openrouter.extra_headers]      # optional OpenRouter attribution
# HTTP-Referer = "https://your-site.example"
# X-Title = "learning-agent"

# To run ANY role through OpenRouter, point it there — two lines per role:
#   [roles.watcher]
#   provider = "openrouter"
#   model = "deepseek/deepseek-chat"     # any id from openrouter.ai/models
# Verify wiring with one command before running:  python loop.py check
#
# THE HOUSE LANE (Aug 2026) — DIRT-CHEAP MODELS ONLY. This platform's
# founding thesis is that capability comes from the system around the
# model: graders refuse false completion, the judge cross-checks, repair
# feeds verbatim errors back, runbooks make repeat work free, and earned
# memory supplies the expertise the model lacks. So the house lane spends
# nothing on model prestige — one OpenRouter key runs every role; swap a
# model id and re-run `python loop.py check`.
#   workers  (Watcher/Librarian/Practitioner/Student):
#     "deepseek/deepseek-v4-flash"       ~$0.22/M in off-peak; cache-hit
#                                         input $0.007/M loves this
#                                         platform's compact windows
#   Examiner (MUST be a different family — uncorrelated blind spots,
#   NOT a more expensive one; difference is the property, price is not):
#     "google/gemini-2.5-flash-lite"     ~$0.10/$0.40 per M — the judge
#                                         costs LESS than the workers
#   Ripper/Reflector (mechanical): "deepseek/deepseek-v4-flash"
#   Escalation (rare, [[ESCALATE]] only): "deepseek/deepseek-v4-pro" —
#     still value-priced; the ladder exists, it just never needs to
#     leave the cheap tier
#   vision (scanned pages, slides): OPENROUTER_VISION_MODEL env var,
#     default "google/gemini-flash-1.5".
# The $0 variant: OpenRouter ":free" ids + Cloudflare's 10k Neurons/day +
# Gemini's free flash quota + a local Ollama rail — rate-limited, fine
# for overnight study and testing.
#
# FREE LANE — open-source models at $0 via OpenRouter's :free tier.
# A free OpenRouter account + one key runs the ENTIRE system without charge
# (rate-limited; ideal for testing and light overnight study). Example:
#   model = "deepseek/deepseek-chat-v3-0324:free"        # workers
#   model = "meta-llama/llama-3.3-70b-instruct:free"     # Examiner
#     (different family than the workers, kept uncorrelated — for free)
# Browse current free ids: https://openrouter.ai/models?max_price=0
# Then: python loop.py check — every role must say OK.

# Anthropic (Claude), OFFICIAL API. Verified:
# platform.claude.com/docs/en/api/openai-sdk — Anthropic ships an
# OpenAI-compatible layer, so the official key drops in with a base_url
# and a model name. NOTE THE TRAILING SLASH — their docs write /v1/ and a
# missing slash is the 404 nobody diagnoses.
# HONEST CAVEATS from that page: the `strict` tool-schema guarantee is
# ignored (tool-call JSON usually conforms, it is not contractually
# guaranteed), and prompt caching is not available through this layer.
# FREE TIER: none. Strong choice for the EXAMINER role — a different
# family from every worker lane above, which is what the judge needs.
# [providers.anthropic]
# base_url = "https://api.anthropic.com/v1/"
# api_key_env = "ANTHROPIC_API_KEY"
# model: "claude-sonnet-5"

# Google Gemini, OFFICIAL API. Verified:
# ai.google.dev/gemini-api/docs/openai — an OpenAI-compatible endpoint;
# note the unusual path, /v1beta/openai/, not /v1.
# FREE TIER: Google AI Studio keys carry a standing free quota on flash
# models (rate-limited) — one of the few real no-card free lanes.
# [providers.gemini]
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
# api_key_env = "GEMINI_API_KEY"
# model: "gemini-3.5-flash"

# xAI (Grok), OFFICIAL API. Verified: docs.x.ai/developers/quickstart —
# OpenAI-compatible at /v1, Bearer key auth. FREE TIER: none standing.
# [providers.xai]
# base_url = "https://api.x.ai/v1"
# api_key_env = "XAI_API_KEY"
# model: "grok-4"

# LOCAL MODELS — NO KEY AT ALL. Ollama and LM Studio expose the same
# OpenAI-compatible contract on localhost, so a machine with a downloaded
# model runs the whole platform with zero keys, zero spend, zero egress.
# api_key_env still names a variable (the protocol wants a token string);
# set OLLAMA_API_KEY=local in agent.env — the value is never checked.
# Pick a model tagged for TOOLS (ollama.com/search?c=tools); a model
# without function calling cannot drive the loop (see the Cloudflare note).
# [providers.ollama]
# base_url = "http://127.0.0.1:11434/v1"
# api_key_env = "OLLAMA_API_KEY"
# free = true
# model: "qwen3:30b"  (or any tools-capable model you have pulled)
# [providers.lmstudio]
# base_url = "http://127.0.0.1:1234/v1"
# api_key_env = "OLLAMA_API_KEY"
# free = true

# THE PRIVACY LANE — sensitive work that must never leave this machine.
# Pin a role to a local rail and it has zero egress BY WIRING, not by
# promise: no key, no cloud, nothing to leak. Pair with the
# `privacy-warden` archetype, whose charter also refuses cloud fallback.
#   [roles.private]
#   provider = "ollama"
#   model = "qwen3:30b"        # any tools-capable local model you pulled

# The SUBQUERY rail (Recursive Language Models, MIT CSAIL 2025): the
# `subquery` tool sends file slices to disposable sub-calls so material
# never enters the orchestrating window. Define this role to pin those
# sub-calls to their own — typically the cheapest — rail; without it they
# ride the calling task's role.
#   [roles.subquery]
#   provider = "openrouter"
#   model = "deepseek/deepseek-v4-flash"

# ----------------------------------------------------------------- roles
# One block per role; switching provider/model is a one-line change.
# Role -> model mapping per the master document Part 7: Ripper/Reflector on
# the cheapest capable model; workers on DeepSeek; the Examiner on a
# DIFFERENT model family (Groq Llama) so blind spots don't overlap.

[roles.default]
provider = "deepseek"
model = "deepseek-chat"

[roles.ripper]
provider = "deepseek"
model = "deepseek-chat"

[roles.watcher]
provider = "deepseek"
model = "deepseek-chat"
# Rule of Two: roles that read untrusted source material don't hold run_command
tools = ["read_file", "write_file", "finish_task", "ask_human", "subquery"]

[roles.librarian]
provider = "deepseek"
model = "deepseek-chat"
tools = ["read_file", "write_file", "finish_task", "ask_human"]

[roles.practitioner]
provider = "deepseek"
model = "deepseek-chat"
fallback_provider = "openrouter"
fallback_model = "deepseek/deepseek-chat"
# Model routing: cheap by default, expensive on hard steps. This model takes
# over when the agent hits escalate_after_errors consecutive tool errors, or
# writes [[ESCALATE]] itself. Uncomment once you have the key.
# escalate_provider = "openrouter"
# escalate_model = "anthropic/claude-opus-4.7"

[roles.examiner]
provider = "groq"
model = "llama-3.3-70b-versatile"

[roles.reflector]
provider = "deepseek"
model = "deepseek-chat"
tools = ["read_file", "write_file", "finish_task", "ask_human"]

[roles.consultant]
provider = "deepseek"
model = "deepseek-chat"
# answers only — no shell; evidence is injected by the harness (consult.py)
tools = ["read_file", "write_file", "finish_task", "ask_human"]

[roles.student]
provider = "deepseek"
model = "deepseek-chat"
# CLOSED BOOK BY CONSTRUCTION: no read access at all — the Student cannot
# open the notes even if it tries; mission/index/questions arrive in context.
tools = ["write_file", "finish_task", "ask_human"]
